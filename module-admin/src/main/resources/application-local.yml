spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ADMIN_DB_HOST}:3307/ecommerce?useSSL=false&serverTimezone=Asia/Seoul
    username: ${ADMIN_DB_USER}
    password: ${ADMIN_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect